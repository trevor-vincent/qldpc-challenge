name: formal-replay

permissions:
  contents: read
  issues: write

# Re-runs the build recipe recorded in every `formal` certificate
# (verify/replay_formal.py): weekly, on dispatch, and on PRs touching certs/
# or the replayer. Scheduled runs post one line per certificate to #2996,
# with the dates of the recorded toolchain and mathlib and an advisory
# second replay at the repository's current default branch, which is where a
# Lean or mathlib bump that breaks the proof shows up first (#2955, m13v).
# Only the pinned replay fails the run; re-pinning is a maintainer decision.
on:
  pull_request:
    paths:
      - "certs/**"
      - "verify/replay_formal.py"
      - ".github/workflows/formal-replay.yml"
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      slugs:
        description: "space-separated certificate slugs (default: every formal certificate)"
        required: false
        default: ""

concurrency:
  group: formal-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRACKING_ISSUE: "2996"
  PYTHONUNBUFFERED: "1"

jobs:
  replay:
    runs-on: ubuntu-latest
    # per-certificate cap is --timeout below; this is for a hang
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: skip when there is nothing at the formal tier
        id: have
        run: |
          n=$(python3 - <<'EOF'
          import glob, json
          print(sum(1 for p in glob.glob("certs/*.json")
                    if (json.load(open(p)).get("verification") or {}).get("level") == "formal"))
          EOF
          )
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n formal certificate(s)"
      - name: install elan and git-lfs
        if: steps.have.outputs.count != '0'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs >/dev/null
          git lfs install --skip-repo
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          /tmp/elan-init -y --default-toolchain none >/dev/null
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: replay every recorded recipe
        if: steps.have.outputs.count != '0'
        id: replay
        continue-on-error: true
        run: |
          uv run --frozen python verify/replay_formal.py --all --timeout 2400 --json formal-replay.json \
            ${{ github.event.inputs.slugs && format('{0}', github.event.inputs.slugs) || '' }} | tee formal-replay.txt
      - name: advisory replay at the repository's current default branch
        if: steps.have.outputs.count != '0' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          uv run --frozen python verify/replay_formal.py --all --head --timeout 2400 --json formal-replay-head.json \
            ${{ github.event.inputs.slugs && format('{0}', github.event.inputs.slugs) || '' }} | tee formal-replay-head.txt
      - name: report to the tracking issue
        if: steps.have.outputs.count != '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Replay of ${{ github.event_name == 'schedule' && 'the weekly schedule' || 'a manual dispatch' }}, run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) at $(date -u +%Y-%m-%dT%H:%MZ), main at ${{ github.sha }}."
            echo
            echo '| certificate | pinned replay | seconds | repository @ commit | theorem | toolchain (released) | mathlib (committed) | head replay (advisory) |'
            echo '|---|---|---|---|---|---|---|---|'
            python3 - <<'EOF'
          import json, os
          def status(r):
              s = r["status"] + (f" ({r['detail']})" if r.get("detail") else "")
              return "ok" if r["status"] == "ok" else "**" + s + "**"
          def dated(name, date, age):
              return "?" if not name else name + (f" ({date}, {age} d old)" if date else "")
          head = {}
          if os.path.exists("formal-replay-head.json"):
              head = {r["slug"]: r for r in json.load(open("formal-replay-head.json"))}
          for r in json.load(open("formal-replay.json")):
              h = head.get(r["slug"])
              hcol = "not run" if h is None else (
                  f"{status(h)} at {str(h.get('commit'))[:12]} in {h['seconds']} s, toolchain "
                  f"{dated(h.get('toolchain'), h.get('toolchain_date'), h.get('toolchain_age_days'))}, "
                  f"mathlib {dated(h.get('mathlib'), h.get('mathlib_date'), h.get('mathlib_age_days'))}")
              tc = dated(r.get('toolchain'), r.get('toolchain_date'), r.get('toolchain_age_days'))
              if r.get("latest_toolchain"):
                  tc += f"; current release {r['latest_toolchain']}"
              print(f"| `{r['slug']}` | {status(r)} | {r['seconds']} | {r.get('repo')} @ {str(r.get('commit'))[:12]} | {r.get('theorem')} | {tc} | {dated(r.get('mathlib'), r.get('mathlib_date'), r.get('mathlib_age_days'))} | {hcol} |")
          EOF
            echo
            echo "A status other than ok in the pinned column means the recorded recipe did not reach the theorem under the run's cap. The certificate is unchanged; re-pinning is a maintainer decision. The head column is advisory: it rebuilds the theorem at the repository's current default branch with that branch's own toolchain and mathlib, so a bump that breaks the proof shows there first. Nothing gates on it."
          } > comment.md
          gh issue comment "$TRACKING_ISSUE" --body-file comment.md
      - name: fail the run if a recipe did not replay
        if: steps.have.outputs.count != '0' && steps.replay.outcome != 'success'
        run: |
          echo "at least one formal certificate did not replay; see formal-replay.txt above"
          exit 1
